# «Клиентский радар»: всё приложение одной командой.
#   cp secrets.env .env   (или .env.example → .env и заполнить)
#   docker compose up -d --build
# Кабинет откроется на http://localhost:8080. Для Telegram нужен HTTPS-адрес (см. README).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?заполните POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-radar}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-radar}
    depends_on:
      db: {condition: service_healthy}

  bot:
    build: ./bot
    restart: unless-stopped
    env_file: .env

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["8080:80"]
    depends_on: [backend]

volumes:
  pgdata:
